[project]
name = "widegold-agent"
version = "1.3.0"
description = "WideGold V1: production-shaped broad-index + RMB gold factor intelligence platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.16,<2",
  "psycopg[binary]>=3.2,<4",
  "asyncpg>=0.30,<1",
  "redis>=6,<7",
  "httpx>=0.28,<1",
  "pyyaml>=6,<7",
  "numpy>=2,<3",
  "pandas>=2.3,<4",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
  "akshare>=1.18,<2",
  "prefect==3.8.5",
  "langgraph>=1.1.5,<2",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "typing-extensions>=4.15,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
widegold-mock = "widegold.mock_runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/widegold"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
