name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: python -m pip install -e ".[dev]"
      - name: Python 测试
        run: pytest -q
      - name: Compileall
        run: python -m compileall apps src scripts tests
      - name: Compose 配置检查
        run: |
          cp .env.final.example .env
          docker compose config >/dev/null

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安装前端依赖
        run: npm install
      - name: 前端生产构建
        run: npm run build
