scoring:
  factor_state_range:
  - -100
  - 100
  asset_score_formula: clip(50 + direction_score/2, 0, 100)
  labels:
  - min: 80
    max: 100
    label: 强势偏积极
  - min: 65
    max: 79.999
    label: 偏积极
  - min: 45
    max: 64.999
    label: 中性/观察
  - min: 30
    max: 44.999
    label: 偏谨慎
  - min: 0
    max: 29.999
    label: 强风险警示
  confidence_prior:
    coverage: 0.3
    source_quality: 0.25
    agreement: 0.2
    stability: 0.15
    context_certainty: 0.1
governance:
  factor_lifecycle:
  - candidate
  - research
  - shadow
  - approved
  - deprecated
  production_online_weight_learning: false
  required_backtest: point_in_time_walk_forward
  versioned:
  - factor_schema
  - factor_logic
  - weights
  - event_rules
  - data_definitions
  - prompts
  - scoring_engine
