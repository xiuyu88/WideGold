server {
    listen 80;
    server_name _;

    # Docker embedded DNS. Using variables forces periodic re-resolution so nginx keeps working
    # after api/web containers are recreated and receive new IP addresses.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:8000;
    set $web_upstream web:80;

    # Admin business-trace SSE. Full container logs are intentionally not proxied to browsers.
    location ~ ^/api/v1/admin/runs/.*/trace/stream$ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://$api_upstream;
    }

    location /ready {
        proxy_pass http://$api_upstream;
    }

    location / {
        proxy_pass http://$web_upstream;
        proxy_set_header Host $host;
    }
}
