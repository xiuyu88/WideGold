version: 1.6.0
indicators:
- id: CN_DR007
  name: DR007
  provider: external
  source_id: CHINAMONEY_AKSHARE
  frequency: daily
  external_params:
    capability: china_money.dr007
    unit: percent
    semantic: Depository-institution 7-day pledged repo fixing/close proxy matching DR007 semantics; do not substitute
      FR007.
    expected_range:
    - 0.0
    - 20.0
    asset_scoped: false
    required_metadata:
    - benchmark
    metadata_equals:
      benchmark: DR007
- id: CN_M1_YOY
  name: 中国M1同比
  provider: akshare
  source_id: SINA_PBOC_PROXY
  frequency: monthly
  lookback_days: 2200
  params:
    function: macro_china_supply_of_money
    kwargs: {}
  parser:
    date_column: 统计时间
    value_column: 货币（狭义货币M1）同比增长
  definition_version: AK_M1_YOY_V1
- id: CN_TSFIN_GROWTH
  name: 社会融资规模增量（用于同比扩张代理）
  provider: akshare
  source_id: MOFCOM_PBOC_PROXY
  frequency: monthly
  lookback_days: 2200
  params:
    function: macro_china_shrzgm
    kwargs: {}
  parser:
    date_column: 月份
    value_column: 社会融资规模增量
  definition_version: AK_TSF_INCREMENT_V1
- id: CN_CGB_10Y
  name: 中债国债10年收益率
  provider: akshare
  source_id: CHINABOND
  frequency: daily
  lookback_days: 400
  params:
    function: bond_china_yield
    kwargs:
      start_date: $START_YYYYMMDD
      end_date: $END_YYYYMMDD
  parser:
    date_column: 日期
    value_column: 10年
    where:
      曲线名称: 中债国债收益率曲线
- id: CN_PMI_MANUFACTURING
  name: 官方制造业PMI
