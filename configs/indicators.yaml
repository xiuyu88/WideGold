- id: CN_FOREIGN_ACTIVITY
  name: 境外资金活动代理
  provider: external
  source_id: EASTMONEY_HKEX_PROXY
  frequency: quarterly
  external_params:
    capability: china_equity.foreign_activity
    unit: provider_declared_signed_flow
    semantic: Directional foreign participation/holding-flow proxy. Turnover alone is not acceptable because it
      has no positive/negative direction.
    asset_scoped: false
    required_metadata:
    - directionality
    - measure_type
    metadata_equals:
      directionality: signed
    metadata_forbidden_values:
      measure_type:
      - turnover
      - turnover_only
