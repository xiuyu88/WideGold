  parser:
    date_column: 月份
    value_column: 制造业-指数
- id: CN_INDUSTRIAL_PRODUCTION_YOY
  name: 规模以上工业增加值同比
  provider: akshare
  source_id: JIN10_NBS_PROXY
  frequency: monthly
  lookback_days: 2200
  params:
    function: macro_china_industrial_production_yoy
    kwargs: {}
  parser:
    date_column: 日期
    value_column: 今值
  definition_version: AK_INDUSTRIAL_PRODUCTION_YOY_V1
- id: CN_EXPORTS_YOY
  name: 中国美元计价出口同比
  provider: akshare
  source_id: JIN10_CUSTOMS_PROXY
  frequency: monthly
  lookback_days: 2200
  params:
