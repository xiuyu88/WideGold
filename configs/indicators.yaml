- id: CN_PPI_YOY
  name: 中国PPI同比
  provider: akshare
  source_id: EASTMONEY_NBS_PROXY
  frequency: monthly
  lookback_days: 2200
  params:
    function: macro_china_ppi
    kwargs: {}
  parser:
    date_column: 月份
    value_column: 当月同比增长
  definition_version: AK_PPI_YOY_V1
- id: CN_INDUSTRIAL_PROFIT_YOY
  name: 工业企业利润同比
  provider: nbs
  source_id: NBS
  frequency: monthly
  lookback_days: 2200
  params:
    listing_url: https://www.stats.gov.cn/sj/zxfb/
    max_pages: 8
  definition_version: NBS_INDUSTRIAL_PROFIT_YTD_V1
  validation_params:
    asset_scoped: false
    expected_range:
    - -100.0
    - 500.0
    unit: percent_yoy
    required_metadata:
    - aggregation_scope
    metadata_allowed_values:
      aggregation_scope:
      - current_month
      - ytd
- id: CN_INDEX_EARNINGS_REV
  name: 指数盈利修正
  provider: external
  source_id: EASTMONEY_AKSHARE
  frequency: weekly
  external_params:
    capability: equity_index.earnings_revision
    unit: revision_breadth_percent
    semantic: Asset-scoped analyst earnings revision breadth, preferably %up revisions minus %down revisions over
      a fixed window.
    expected_range:
    - -100.0
    - 100.0
    asset_scoped: true
    required_metadata:
    - methodology
    - window_days
    metadata_allowed_values:
      methodology:
      - revision_breadth
    metadata_numeric_min:
      window_days: 1
- id: CN_INDEX_PE
  name: 中证指数滚动市盈率
  provider: akshare
  source_id: CSINDEX
  frequency: daily
  lookback_days: 500
  params:
    function: stock_zh_index_hist_csindex
    kwargs:
      start_date: $START_YYYYMMDD
      end_date: $END_YYYYMMDD
    asset_params:
      CSI300:
        symbol: '000300'
      CSI_A500:
        symbol: '000510'
      CSI500:
        symbol: 000905
      CSI1000:
        symbol: 000852
  parser:
    date_column: 日期
    value_column: 滚动市盈率
  definition_version: CSINDEX_PE_V2
